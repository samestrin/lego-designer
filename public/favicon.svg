<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- lego-designer mark: 3×3 brick-edge mosaic, white highlight cell, amber base row -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="10" fill="#121212"/>
  <!-- glow behind the white cell -->
  <circle cx="14" cy="14" r="15" fill="url(#glow)"/>
  <!-- studs (two per cell, riding the top edge) -->
  <g>
    <!-- row 1 -->
    <rect x="9"  y="3" width="4" height="4" rx="1" fill="#F4F4F4"/>
    <rect x="15" y="3" width="4" height="4" rx="1" fill="#F4F4F4"/>
    <rect x="27" y="3" width="4" height="4" rx="1" fill="#545A61"/>
    <rect x="33" y="3" width="4" height="4" rx="1" fill="#545A61"/>
    <rect x="45" y="3" width="4" height="4" rx="1" fill="#545A61"/>
    <rect x="51" y="3" width="4" height="4" rx="1" fill="#545A61"/>
    <!-- row 2 -->
    <rect x="9"  y="21" width="4" height="4" rx="1" fill="#545A61"/>
    <rect x="15" y="21" width="4" height="4" rx="1" fill="#545A61"/>
    <rect x="27" y="21" width="4" height="4" rx="1" fill="#545A61"/>
    <rect x="33" y="21" width="4" height="4" rx="1" fill="#545A61"/>
    <rect x="45" y="21" width="4" height="4" rx="1" fill="#545A61"/>
    <rect x="51" y="21" width="4" height="4" rx="1" fill="#545A61"/>
    <!-- row 3 -->
    <rect x="9"  y="39" width="4" height="4" rx="1" fill="#FFB937"/>
    <rect x="15" y="39" width="4" height="4" rx="1" fill="#FFB937"/>
    <rect x="27" y="39" width="4" height="4" rx="1" fill="#FFB937"/>
    <rect x="33" y="39" width="4" height="4" rx="1" fill="#FFB937"/>
    <rect x="45" y="39" width="4" height="4" rx="1" fill="#FFB937"/>
    <rect x="51" y="39" width="4" height="4" rx="1" fill="#FFB937"/>
  </g>
  <!-- cells -->
  <g>
    <!-- row 1: white + gray + gray -->
    <rect x="6"  y="6"  width="16" height="16" fill="#F4F4F4"/>
    <rect x="24" y="6"  width="16" height="16" fill="#3F444A"/>
    <rect x="42" y="6"  width="16" height="16" fill="#3F444A"/>
    <!-- row 2: gray ×3 -->
    <rect x="6"  y="24" width="16" height="16" fill="#3F444A"/>
    <rect x="24" y="24" width="16" height="16" fill="#3F444A"/>
    <rect x="42" y="24" width="16" height="16" fill="#3F444A"/>
    <!-- row 3: amber ×3 -->
    <rect x="6"  y="42" width="16" height="16" fill="#F59E0B"/>
    <rect x="24" y="42" width="16" height="16" fill="#F59E0B"/>
    <rect x="42" y="42" width="16" height="16" fill="#F59E0B"/>
  </g>
  <!-- brick-edge bevels: lit top, shadowed bottom -->
  <g fill="#FFFFFF" opacity="0.25">
    <rect x="6" y="6" width="16" height="2"/><rect x="24" y="6" width="16" height="2"/><rect x="42" y="6" width="16" height="2"/>
    <rect x="6" y="24" width="16" height="2"/><rect x="24" y="24" width="16" height="2"/><rect x="42" y="24" width="16" height="2"/>
    <rect x="6" y="42" width="16" height="2"/><rect x="24" y="42" width="16" height="2"/><rect x="42" y="42" width="16" height="2"/>
  </g>
  <g fill="#000000" opacity="0.35">
    <rect x="6" y="20" width="16" height="2"/><rect x="24" y="20" width="16" height="2"/><rect x="42" y="20" width="16" height="2"/>
    <rect x="6" y="38" width="16" height="2"/><rect x="24" y="38" width="16" height="2"/><rect x="42" y="38" width="16" height="2"/>
    <rect x="6" y="56" width="16" height="2"/><rect x="24" y="56" width="16" height="2"/><rect x="42" y="56" width="16" height="2"/>
  </g>
</svg>
